name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated unit tests without database services
        run: docker compose run --build --rm --no-deps backend pytest -q -m unit
      - name: Start test database
        run: docker compose up -d db
      - name: Run integration tests
        run: docker compose run --rm backend pytest -q -m integration
      - name: Run security tests
        run: docker compose run --rm backend pytest -q -m security
      - name: Run system tests
        run: docker compose run --rm backend pytest -q -m system
      - name: Run stress tests
        run: docker compose run --rm backend pytest -q -m stress
      - name: Run complete backend suite
        run: docker compose run --build --rm backend pytest -q
      - name: Stop test services
        if: always()
        run: docker compose down -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  local-ai-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight contract-test dependencies
        run: pip install pydantic==2.11.7 pytest==8.4.1
      - name: Test local model output parsing and safety mapping
        env:
          PYTHONPATH: local_ai
        run: pytest -q local_ai/tests

  fresh-compose-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: docker compose up --build -d db backend worker web
      - name: Wait for the public application
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/api/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify web entry point and running services
        run: |
          curl --fail --silent http://localhost:8080/ | grep --quiet '<title>PlacePulse</title>'
          test "$(docker compose ps --services --status running | wc -l)" -eq 4
      - name: Stop fresh stack
        if: always()
        run: docker compose down -v

  deploy-azure:
    name: Deploy to Azure VM
    needs: [backend-tests, frontend-build, local-ai-contract-tests, fresh-compose-start]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-production
    concurrency:
      group: azure-production
      cancel-in-progress: false
    permissions: {}
    env:
      AZURE_VM_HOST: ${{ vars.AZURE_VM_HOST }}
      AZURE_VM_USER: ${{ vars.AZURE_VM_USER }}
    steps:
      - name: Deploy tested commit over SSH
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          AZURE_VM_SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_VM_HOST" || -z "$AZURE_VM_USER" || \
                -z "$AZURE_VM_SSH_PRIVATE_KEY" || -z "$AZURE_VM_KNOWN_HOSTS" ]]; then
            echo "Azure SSH deployment variables or secrets are not configured." >&2
            exit 1
          fi
          if [[ ! "$AZURE_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "AZURE_VM_HOST must be an IPv4 address or DNS name." >&2
            exit 1
          fi
          if [[ ! "$AZURE_VM_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            echo "AZURE_VM_USER is invalid." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full Git commit SHA is required." >&2
            exit 1
          fi

          ssh_dir="$HOME/.ssh"
          private_key="$ssh_dir/placepulse_deploy"
          known_hosts="$ssh_dir/known_hosts"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$AZURE_VM_SSH_PRIVATE_KEY" | tr -d '\r' > "$private_key"
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts"
          chmod 600 "$private_key" "$known_hosts"
          trap 'rm -f "$private_key" "$known_hosts"' EXIT

          ssh \
            -i "$private_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            "sh -s -- '$DEPLOY_COMMIT'" <<'REMOTE_SCRIPT'
          set -eu

          commit_sha="$1"
          repository_dir="/opt/placepulse"

          if [ ! -d "$repository_dir/.git" ] || [ ! -f "$repository_dir/.env" ]; then
            echo "PlacePulse must be installed in $repository_dir before automatic deployment." >&2
            exit 2
          fi

          cd "$repository_dir"
          git fetch --depth=1 origin "$commit_sha"
          git reset --hard FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$commit_sha"

          docker compose up --build -d --remove-orphans

          attempt=1
          while [ "$attempt" -le 60 ]; do
            if docker compose exec -T web \
              wget -qO- http://127.0.0.1/api/health 2>/dev/null \
              | grep -q '"status":"ok"'; then
              docker compose ps
              echo "Deployed and verified commit $commit_sha."
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done

          docker compose ps
          docker compose logs --tail=150
          echo "The deployment did not become healthy in time." >&2
          exit 1
          REMOTE_SCRIPT

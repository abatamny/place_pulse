name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start test database
        run: docker compose up -d db
      - name: Run backend tests
        run: docker compose run --build --rm backend pytest -q
      - name: Stop test services
        if: always()
        run: docker compose down -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  fresh-compose-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: docker compose up --build -d
      - name: Wait for the public application
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/api/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify web entry point and running services
        run: |
          curl --fail --silent http://localhost:8080/ | grep --quiet '<title>PlacePulse</title>'
          test "$(docker compose ps --services --status running | wc -l)" -eq 4
      - name: Stop fresh stack
        if: always()
        run: docker compose down -v

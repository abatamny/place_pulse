name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start test database
        run: docker compose up -d db
      - name: Run backend tests
        run: docker compose run --build --rm backend pytest -q
      - name: Stop test services
        if: always()
        run: docker compose down -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  fresh-compose-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: docker compose up --build -d
      - name: Wait for the public application
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/api/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify web entry point and running services
        run: |
          curl --fail --silent http://localhost:8080/ | grep --quiet '<title>PlacePulse</title>'
          test "$(docker compose ps --services --status running | wc -l)" -eq 4
      - name: Stop fresh stack
        if: always()
        run: docker compose down -v

  deploy-azure:
    name: Deploy to Azure VM
    needs: [backend-tests, frontend-build, fresh-compose-start]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-production
    concurrency:
      group: azure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy tested commit to the VM
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          if [[ -z "$AZURE_RESOURCE_GROUP" || -z "$AZURE_VM_NAME" ]]; then
            echo "Azure deployment variables are not configured." >&2
            exit 1
          fi

          az vm show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --output none

          deployment_script="$(< deploy/azure/update-vm.sh)"
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts "$deployment_script" \
            --parameters "$DEPLOY_COMMIT" \
            --query "value[0].message" \
            --output tsv

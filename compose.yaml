services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placepulse}
      POSTGRES_USER: ${POSTGRES_USER:-placepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: placepulse-backend
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:-local-development-secret}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-PlacePulse-Course-Project/0.1}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/responses}
      AI_API_FORMAT: ${AI_API_FORMAT:-responses}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_MODERATION_URL: ${AI_MODERATION_URL:-https://api.openai.com/v1/moderations}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-omni-moderation-latest}
      AI_MEDIA_MODERATION_MODE: ${AI_MEDIA_MODERATION_MODE:-moderations}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-placepulse}
      POSTGRES_USER: ${POSTGRES_USER:-placepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placepulse}
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: placepulse-backend
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/responses}
      AI_API_FORMAT: ${AI_API_FORMAT:-responses}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_MODERATION_URL: ${AI_MODERATION_URL:-https://api.openai.com/v1/moderations}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-omni-moderation-latest}
      AI_MEDIA_MODERATION_MODE: ${AI_MEDIA_MODERATION_MODE:-moderations}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-placepulse}
      POSTGRES_USER: ${POSTGRES_USER:-placepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placepulse}
      MEDIA_ROOT: /app/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
